<div class="password-manager">
  <header class="password-manager-header">
    <div class="page-inner header-inner">
      <button type="button" class="btn-back" (click)="goBack()" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M15 5l-7 7 7 7"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <h1>My service Passwords</h1>
    </div>
  </header>

  <main class="password-manager-content">
    @if (errorMessage()) {
      <div class="surface-panel status-banner error" role="alert">
        <p>{{ errorMessage() }}</p>
        <button type="button" class="btn-retry" (click)="loadAccounts()">Réessayer</button>
      </div>
    }

    <app-pm-stats-panel
      [topCategories]="topCategories()"
      [topProviders]="topProviders()"
    />

    <app-pm-filters-bar
      [search]="search()"
      [categoryId]="categoryId()"
      [providerId]="providerId()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      [viewMode]="viewMode()"
      [categories]="categories()"
      [providers]="providers()"
      (searchChange)="search.set($event)"
      (categoryIdChange)="categoryId.set($event)"
      (providerIdChange)="providerId.set($event)"
      (sortFieldChange)="sortField.set($event)"
      (sortDirectionChange)="sortDirection.set($event)"
      (viewModeChange)="viewMode.set($event)"
    />

    @if (isLoading()) {
      <div class="surface-panel status-banner" aria-live="polite">
        <p>Chargement des comptes...</p>
      </div>
    } @else {
      <app-pm-accounts-panel
        [accounts]="filteredAccounts()"
        [viewMode]="viewMode()"
        (accountSelected)="openAccountDetail($event)"
      />
    }
  </main>

  <app-pm-account-detail-modal
    [open]="isDetailOpen()"
    [account]="detailAccount()"
    [isLoading]="detailLoading()"
    [error]="detailError()"
    (closed)="closeAccountDetail()"
    (retry)="retryAccountDetail()"
  />
</div>
