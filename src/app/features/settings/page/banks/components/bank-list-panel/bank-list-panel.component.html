<section class="surface-panel data-panel" aria-label="Banques">
  @if (isLoading()) {
    <div class="state-block" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p>Chargement des banques...</p>
    </div>
  } @else if (error()) {
    <div class="state-block error" role="alert">
      <p>{{ error() }}</p>
      <button type="button" class="btn-retry" (click)="retry.emit()">Réessayer</button>
    </div>
  } @else if (banks().length === 0) {
    <div class="state-block">
      <p>Aucune banque. Utilisez « Ajouter une banque » pour en créer une.</p>
    </div>
  } @else {
    <div class="items-layout" [class.grid]="viewMode() === 'grid'" [class.list]="viewMode() === 'list'">
      @for (bank of banks(); track bank.id) {
        <app-bank-item
          [bank]="bank"
          [viewMode]="viewMode()"
          (deleteClick)="deleteClick.emit($event)"
        />
      }
    </div>
  }
</section>
