<section class="surface-panel filters-bar" aria-label="Filtres">
  <div class="filters-row">
    <label class="search-field">
      <span class="sr-only">Rechercher</span>
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75" />
        <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        placeholder="Rechercher un réseau..."
        [ngModel]="search()"
        (ngModelChange)="searchChange.emit($event)"
      />
    </label>

    <select
      class="filter-select"
      [ngModel]="sortField()"
      (ngModelChange)="sortFieldChange.emit($event)"
      aria-label="Trier par"
    >
      <option value="name">Nom</option>
      <option value="code">Code</option>
    </select>

    <button
      type="button"
      class="sort-dir"
      [attr.aria-label]="sortDirection() === 'desc' ? 'Ordre décroissant' : 'Ordre croissant'"
      (click)="sortDirectionChange.emit(sortDirection() === 'desc' ? 'asc' : 'desc')"
    >
      {{ sortDirection() === 'desc' ? '↓' : '↑' }}
    </button>

    <div class="filters-actions">
      <button type="button" class="btn-create" (click)="createClick.emit()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        Ajouter un réseau
      </button>

      <div class="view-toggle" role="group" aria-label="Mode d'affichage">
        <button
          type="button"
          class="view-btn"
          [class.active]="viewMode() === 'list'"
          (click)="viewModeChange.emit('list')"
          aria-label="Vue liste"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
        </button>
        <button
          type="button"
          class="view-btn"
          [class.active]="viewMode() === 'grid'"
          (click)="viewModeChange.emit('grid')"
          aria-label="Vue grille"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
