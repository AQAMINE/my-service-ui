@if (open()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div
      class="modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-card-provider-title"
      (click)="$event.stopPropagation()"
    >
      <h2 id="delete-card-provider-title">Supprimer le réseau</h2>
      <p class="delete-warning">
        <strong>{{ provider()?.name }}</strong> sera définitivement supprimé.
        Cette action est irréversible.
      </p>
      <p class="delete-instruction">
        Pour confirmer, tapez
        <strong>{{ provider()?.name }}</strong>
        ou
        <strong>{{ keyword }}</strong>
        ci-dessous.
      </p>

      <input
        type="text"
        class="delete-input"
        [ngModel]="confirmInput()"
        (ngModelChange)="confirmInput.set($event)"
        autocomplete="off"
        [disabled]="submitting()"
        [attr.aria-label]="'Tapez ' + (provider()?.name || keyword) + ' pour confirmer'"
      />

      @if (submitError()) {
        <p class="submit-error" role="alert">{{ submitError() }}</p>
      }

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">
          Annuler
        </button>
        <button
          type="button"
          class="btn-danger"
          (click)="confirm()"
          [disabled]="!canConfirm() || submitting()"
        >
          @if (submitting()) {
            <span class="spinner small" aria-hidden="true"></span>
            Suppression...
          } @else {
            Supprimer
          }
        </button>
      </div>
    </div>
  </div>
}
