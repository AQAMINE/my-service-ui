<article class="cp-item" style="--cp-color: var(--color-primary)">
  <div class="logo-well" aria-hidden="true">
    @if (showLogo()) {
      <img
        [src]="provider().logoUrl!"
        [alt]="''"
        referrerpolicy="no-referrer"
        (error)="onLogoError()"
      />
    } @else {
      <span class="logo-fallback">{{ initials() }}</span>
    }
  </div>

  <div class="item-body">
    <div class="item-top">
      <h3 class="item-name">{{ provider().name }}</h3>
      <div class="badges">
        <span class="badge" [class.system]="isSystem()" [class.custom]="!isSystem()">
          {{ isSystem() ? 'Système' : 'Personnalisé' }}
        </span>
      </div>
    </div>

    <div class="item-meta">
      <span class="slug-chip">{{ provider().code }}</span>
    </div>

    <div class="item-footer">
      <span>{{ isSystem() ? 'Réseau système' : 'Réseau personnalisé' }}</span>
      @if (!isSystem()) {
        <button
          type="button"
          class="btn-delete"
          (click)="onDelete($event)"
          aria-label="Supprimer le réseau"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 7h14M10 7V5h4v2M9 11v6M15 11v6M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      }
    </div>
  </div>
</article>
