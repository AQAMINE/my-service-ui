<article class="user-item">
  <div class="avatar" aria-hidden="true">{{ initials() }}</div>

  <div class="item-body">
    <div class="item-top">
      <h3 class="item-name">{{ displayName() }}</h3>
      <span class="badge" [class.active]="user().enabled" [class.inactive]="!user().enabled">
        {{ user().enabled ? 'Actif' : 'Inactif' }}
      </span>
    </div>

    <div class="item-meta">
      <span class="slug-chip">{{ user().username }}</span>
      @if (user().email) {
        <span class="email">{{ user().email }}</span>
      }
    </div>

    <div class="item-footer">
      <span class="footer-label">Accès au compte</span>

      <label class="status-switch" [class.is-loading]="isToggling()">
        <span class="switch-text">{{ user().enabled ? 'Activé' : 'Désactivé' }}</span>
        <input
          type="checkbox"
          role="switch"
          class="switch-input"
          [checked]="user().enabled"
          [disabled]="isToggling()"
          (change)="onToggle($event)"
          [attr.aria-label]="
            user().enabled
              ? 'Désactiver l\'accès de ' + displayName()
              : 'Activer l\'accès de ' + displayName()
          "
        />
        <span class="switch-track" aria-hidden="true">
          <span class="switch-thumb"></span>
        </span>
      </label>
    </div>
  </div>
</article>
