<section class="surface-panel data-panel" aria-label="Catégories">
  @if (isLoading()) {
    <div class="state-block" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p>Chargement des catégories...</p>
    </div>
  } @else if (error()) {
    <div class="state-block error" role="alert">
      <p>{{ error() }}</p>
      <button type="button" class="btn-retry" (click)="retry.emit()">Réessayer</button>
    </div>
  } @else if (categories().length === 0) {
    <div class="state-block">
      <p>Aucune catégorie. Utilisez « Ajouter une catégorie » pour en créer une.</p>
    </div>
  } @else {
    <div class="items-layout" [class.grid]="viewMode() === 'grid'" [class.list]="viewMode() === 'list'">
      @for (category of categories(); track category.id) {
        <app-category-item
          [category]="category"
          [viewMode]="viewMode()"
          (deleteClick)="deleteClick.emit($event)"
        />
      }
    </div>
  }
</section>
