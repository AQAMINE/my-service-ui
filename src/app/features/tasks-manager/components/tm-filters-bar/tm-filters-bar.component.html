<section class="surface-panel filters-bar" aria-label="Filtres">
  <div class="filters-row">
    <label class="search-field">
      <span class="sr-only">Rechercher</span>
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75" />
        <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        placeholder="Rechercher une tâche..."
        [ngModel]="search()"
        (ngModelChange)="searchChange.emit($event)"
      />
    </label>

    <select
      class="filter-select"
      [ngModel]="statusId()"
      (ngModelChange)="statusIdChange.emit($event)"
      aria-label="Statut"
    >
      <option value="">Tous les statuts</option>
      @for (status of statuses(); track status.id) {
        <option [value]="status.id">{{ status.label }}</option>
      }
    </select>

    <select
      class="filter-select"
      [ngModel]="priorityId()"
      (ngModelChange)="priorityIdChange.emit($event)"
      aria-label="Priorité"
    >
      <option value="">Toutes les priorités</option>
      @for (priority of priorities(); track priority.id) {
        <option [value]="priority.id">{{ priority.label }}</option>
      }
    </select>

    <select
      class="filter-select"
      [ngModel]="sortField()"
      (ngModelChange)="sortFieldChange.emit($event)"
      aria-label="Trier par"
    >
      <option value="dueDate">Échéance</option>
      <option value="createdAt">Date de création</option>
      <option value="priority">Niveau de priorité</option>
    </select>

    <button
      type="button"
      class="sort-dir"
      [attr.aria-label]="sortDirection() === 'desc' ? 'Ordre décroissant' : 'Ordre croissant'"
      (click)="sortDirectionChange.emit(sortDirection() === 'desc' ? 'asc' : 'desc')"
    >
      {{ sortDirection() === 'desc' ? '↓' : '↑' }}
    </button>

    <div class="filters-actions">
      <button type="button" class="btn-ghost" (click)="metadataClick.emit()">
        Colonnes & priorités
      </button>

      <button type="button" class="btn-create" (click)="createClick.emit()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
        Nouvelle tâche
      </button>

      <div class="view-toggle" role="group" aria-label="Mode d'affichage">
        <button
          type="button"
          class="view-btn"
          [class.active]="viewMode() === 'kanban'"
          (click)="viewModeChange.emit('kanban')"
          aria-label="Vue kanban"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4h4.5v16H4V4zm5.75 0H14v10H9.75V4zM15.5 4H20v13h-4.5V4z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
          </svg>
        </button>
        <button
          type="button"
          class="view-btn"
          [class.active]="viewMode() === 'list'"
          (click)="viewModeChange.emit('list')"
          aria-label="Vue liste"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
