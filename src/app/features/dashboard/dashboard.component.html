<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="page-inner header-inner">
      <h1>Dashboard</h1>
    </div>
  </header>

  <main class="dashboard-content">
    <section class="apps-panel" aria-label="Applications">
      <div class="apps-row">
        <app-tile label="My service Passwords" (click)="openPasswordManager()">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M7.5 11V8.5a4.5 4.5 0 119 0V11M8 11h8a2 2 0 012 2v6a2 2 0 01-2 2H8a2 2 0 01-2-2v-6a2 2 0 012-2z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </app-tile>

        <app-tile label="My service Wallet" (click)="openCardsManager()">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M3 8.5A2.5 2.5 0 015.5 6h13A2.5 2.5 0 0121 8.5v9A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5v-9z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linejoin="round"
            />
            <path
              d="M3 10h18M16 14.5h2"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
          </svg>
        </app-tile>

        <app-tile label="Paramètre" (click)="openSettings()">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"
              stroke="currentColor"
              stroke-width="1.75"
            />
            <path
              d="M19.4 13.5a7.7 7.7 0 000-3l1.8-1.4-1.8-3.1-2.2.5a7.6 7.6 0 00-2.6-1.5L14 3h-4l-.6 2a7.6 7.6 0 00-2.6 1.5l-2.2-.5-1.8 3.1L4.6 10.5a7.7 7.7 0 000 3l-1.8 1.4 1.8 3.1 2.2-.5a7.6 7.6 0 002.6 1.5l.6 2h4l.6-2a7.6 7.6 0 002.6-1.5l2.2.5 1.8-3.1-1.8-1.4z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linejoin="round"
            />
          </svg>
        </app-tile>

        @if (isAdmin()) {
          <app-tile label="Administration" (click)="openAdmin()">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3l8 3.2v5.3c0 5.1-3.4 8.7-8 10.5-4.6-1.8-8-5.4-8-10.5V6.2L12 3z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M9.5 12.2l1.7 1.7 3.4-3.5"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </app-tile>
        }

        <app-tile label="Se déconnecter" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M10 7V5a2 2 0 012-2h7a2 2 0 012 2v14a2 2 0 01-2 2h-7a2 2 0 01-2-2v-2"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M15 12H4m0 0l3.5-3.5M4 12l3.5 3.5"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </app-tile>
      </div>
    </section>
  </main>
</div>
