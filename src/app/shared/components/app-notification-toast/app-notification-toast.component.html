@if (notification(); as message) {
  <div
    class="status-toast"
    [class.is-success]="message.type === 'success'"
    [class.is-warning]="message.type === 'warning'"
    [class.is-error]="message.type === 'error'"
    role="status"
    aria-live="polite"
  >
    <div class="toast-glow" aria-hidden="true"></div>

    <div class="toast-icon" aria-hidden="true">
      @switch (message.type) {
        @case ('success') {
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M20 6L9 17l-5-5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
        @case ('warning') {
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
            <path
              d="M9 11a4 4 0 100-8 4 4 0 000 8z"
              stroke="currentColor"
              stroke-width="1.75"
            />
            <path
              d="M17 11l2 2m0 0l2 2m-2-2l-2 2m2-2l2-2"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 9v4m0 4h.01M10.3 4.5h3.4L20 14.5v3a2 2 0 01-2 2H6a2 2 0 01-2-2v-3L10.3 4.5z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      }
    </div>

    <div class="toast-body">
      <p class="toast-title">{{ message.title }}</p>
      <p class="toast-detail">{{ message.detail }}</p>
    </div>

    <button
      type="button"
      class="toast-close"
      (click)="dismiss()"
      aria-label="Fermer la notification"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>

    @if (message.autoDismiss) {
      <div
        class="toast-progress"
        [style.animation-duration.ms]="message.durationMs"
        aria-hidden="true"
      ></div>
    }
  </div>
}
